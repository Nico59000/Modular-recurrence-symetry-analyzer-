name: One-time formalisation PDF replacement

on:
  push:
    branches:
      - main
    paths:
      - '.pdf-build/formalisation_symetries_mod3.tex'

permissions:
  contents: write

jobs:
  build-and-replace:
    if: github.event.head_commit.message == 'Add PDF build source'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile formalisation PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: .pdf-build/formalisation_symetries_mod3.tex
          work_in_root_file_dir: true

      - name: Verify and install PDF
        shell: bash
        run: |
          set -euo pipefail
          source_pdf='.pdf-build/formalisation_symetries_mod3.pdf'
          target_pdf='formalisation_symetries_mod3.pdf'
          test -s "$source_pdf"
          test "$(head -c 5 "$source_pdf")" = '%PDF-'
          grep -a -q '%%EOF' "$source_pdf"
          test "$(stat -c '%s' "$source_pdf")" -gt 50000
          mv "$source_pdf" "$target_pdf"
          test -s "$target_pdf"

      - name: Replace Markdown source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm formalisation_symetries_mod3.md
          git rm .pdf-build/formalisation_symetries_mod3.tex
          rmdir .pdf-build 2>/dev/null || true
          git add formalisation_symetries_mod3.pdf
          git commit -m 'Replace symmetry formalization with PDF'
          git push

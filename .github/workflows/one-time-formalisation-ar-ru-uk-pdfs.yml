name: One-time Arabic Russian Ukrainian formalisation PDFs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-formalisation-ar-ru-uk-pdfs.yml'

permissions:
  contents: write

jobs:
  build-publish-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore byte-exact PDF sources
        run: |
          set -euo pipefail
          mkdir -p .pdf-build/src
          cat .pdf-build/chunks/part* > .pdf-build/sources.exact.b64
          echo 'd102b040a33ba8082056114d16d04ca7a2ce0ba42619930cc036577d131a6d41  .pdf-build/sources.exact.b64' | sha256sum -c -
          base64 -d .pdf-build/sources.exact.b64 > .pdf-build/sources.exact.tar.gz
          echo '4897de4640de19e82280439e1926cff9843bd1d419a684361fa3518c313659d0  .pdf-build/sources.exact.tar.gz' | sha256sum -c -
          tar -xzf .pdf-build/sources.exact.tar.gz -C .pdf-build/src

      - name: Compile and verify all three editions
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            formalisation_symetries_mod3_ar.tex
            formalisation_symetries_mod3_ru.tex
            formalisation_symetries_mod3_uk.tex
          working_directory: .pdf-build/src
          latexmk_use_xelatex: true
          texlive_version: 2026
          os: debian
          extra_system_packages: "fonts-hosny-amiri fonts-noto-core poppler-utils"
          post_compile: |
            set -euo pipefail
            for lang in ar ru uk; do
              pdf="formalisation_symetries_mod3_${lang}.pdf"
              test -s "$pdf"
              pdfinfo "$pdf" | grep -q 'Page size:.*A4'
              pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
              test "$pages" -ge 7
              pdftotext "$pdf" "${lang}.txt"
              test -s "${lang}.txt"
            done

      - name: Publish final PDFs and remove temporary machinery
        run: |
          set -euo pipefail
          for lang in ar ru uk; do
            cp ".pdf-build/src/formalisation_symetries_mod3_${lang}.pdf" \
               "formalisation_symetries_mod3_${lang}.pdf"
          done
          rm -rf .pdf-build
          rm -f .github/workflows/one-time-formalisation-ar-ru-uk-pdfs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Arabic, Russian and Ukrainian formalisation PDFs'
          git push origin main

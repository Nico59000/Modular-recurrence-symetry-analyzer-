name: One-time Dutch formalisation PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-formalisation-nl-pdf.yml'

permissions:
  contents: write

jobs:
  build-publish-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact Dutch source
        run: |
          set -euo pipefail
          cd .pdf-build/nl
          echo '60bceabcc4988526bf17ae7a8be16f8ed39326a8045a2a419e65de6d094f892b  formalisation_symetries_mod3_nl.tex' | sha256sum -c -

      - name: Compile and verify Dutch edition
        uses: xu-cheng/latex-action@v4
        with:
          root_file: formalisation_symetries_mod3_nl.tex
          working_directory: .pdf-build/nl
          latexmk_use_xelatex: true
          texlive_version: 2026
          os: debian
          extra_system_packages: "fonts-dejavu-core poppler-utils"
          post_compile: |
            set -euo pipefail
            pdf='formalisation_symetries_mod3_nl.pdf'
            test -s "$pdf"
            pdfinfo "$pdf" | grep -q 'Page size:.*A4'
            pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
            test "$pages" -eq 7
            pdftotext "$pdf" nl.txt
            test -s nl.txt
            grep -q 'Halfperiodesymmetrieën' nl.txt
            grep -q 'Algoritmische audit' nl.txt
            grep -q 'Reproduceerbare scanresultaten' nl.txt
            grep -q 'Conclusie' nl.txt

      - name: Publish final PDF and remove temporary machinery
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          cp '.pdf-build/nl/formalisation_symetries_mod3_nl.pdf' \
             'formalisation_symetries_mod3_nl.pdf'
          rm -rf .pdf-build/nl
          rmdir .pdf-build 2>/dev/null || true
          rm -f .github/workflows/one-time-formalisation-nl-pdf.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Dutch formalisation PDF'
          git push origin main

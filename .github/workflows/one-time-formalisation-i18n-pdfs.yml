name: One-time multilingual formalisation PDFs

on:
  push:
    paths:
      - '.github/workflows/one-time-formalisation-i18n-pdfs.yml'

permissions:
  contents: write

jobs:
  build-publish-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XeLaTeX and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-chinese texlive-lang-japanese texlive-lang-korean \
            fonts-noto-cjk fonts-dejavu-core poppler-utils

      - name: Compile all language editions
        shell: bash
        run: |
          set -euo pipefail
          cd .pdf-build-i18n
          for source in formalisation_symetries_mod3_{en,it,es,zh_CN,ja,ko}.tex; do
            xelatex -interaction=nonstopmode -halt-on-error "$source"
            xelatex -interaction=nonstopmode -halt-on-error "$source"
          done

      - name: Verify PDFs and install at repository root
        shell: bash
        run: |
          set -euo pipefail
          for pdf in .pdf-build-i18n/formalisation_symetries_mod3_{en,it,es,zh_CN,ja,ko}.pdf; do
            test -s "$pdf"
            pdfinfo "$pdf" | grep -q '^Pages:'
            text_file="${pdf%.pdf}.txt"
            pdftotext "$pdf" "$text_file"
            test -s "$text_file"
            cp "$pdf" .
          done
          sha256sum formalisation_symetries_mod3_{en,it,es,zh_CN,ja,ko}.pdf

      - name: Publish final PDFs and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pdf-build-i18n
          rm -f .github/workflows/one-time-formalisation-i18n-pdfs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add multilingual formalisation PDFs'
          git push origin HEAD:main
